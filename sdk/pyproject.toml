[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventmesh"
version = "0.1.0"
description = "Python SDK for the EventMesh durable event bus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/eventmesh"]
